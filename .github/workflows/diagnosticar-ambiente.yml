# Diagnóstico de prontidão do ambiente para homologação — só leitura.
#
# Roda `scripts/diagnosticar-ambiente.mjs` contra o banco de produção usando os secrets já
# existentes (mesmo padrão de `inventariar-backlog-legado.yml`). Responde, sem ninguém precisar
# da credencial na mão: até qual migration o banco chegou, qual é a primeira pendente, o estado
# de cada gate da rodada, e quais Edge Functions estão declaradas para deploy.
#
# Nenhuma escrita: não aplica migration, não abre gate, não concede nada. O resultado não tem PII
# (só versões de migration, nomes de gate e booleanos) e vai pro Step Summary.
#
# Gatilho manual: é insumo de decisão humana antes de uma janela de ativação, não gate de CI.

name: Diagnóstico de ambiente (produção)

on:
  workflow_dispatch:

concurrency:
  group: diagnosticar-ambiente
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # Mesmo achado de `inventariar-backlog-legado.yml`: o runner não tem rota IPv6 e o host
      # direto resolve só IPv6. O Pooler tem endpoint IPv4, e a região entra no hostname — por
      # isso é descoberta pela Management API, nunca fixada no arquivo.
      - name: Descobrir região do projeto (pro endpoint IPv4 do Pooler)
        id: regiao
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          # `curl -sf` engole o corpo e o código do erro: a falha chegava como "Unexpected end of
          # JSON input", que não diz nada sobre a causa (token expirado? projeto errado?).
          # Aqui o status HTTP é capturado e reportado, sem nunca imprimir o token.
          http=$(curl -s -o /tmp/projeto.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID")
          if [ "$http" != "200" ]; then
            echo "::error::Management API respondeu HTTP $http ao consultar o projeto."
            case "$http" in
              401|403) echo "::error::SUPABASE_ACCESS_TOKEN inválido, expirado ou sem acesso a este projeto. Rotacione o PAT." ;;
              404)     echo "::error::SUPABASE_PROJECT_ID não encontrado para este token." ;;
              000)     echo "::error::sem resposta da API (rede do runner)." ;;
            esac
            exit 1
          fi
          regiao=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/projeto.json","utf8")).region || ""')
          test -n "$regiao" || { echo "::error::projeto respondido sem campo region"; exit 1; }
          echo "Região do projeto: $regiao"
          echo "regiao=$regiao" >> "$GITHUB_OUTPUT"

      - name: Rodar diagnóstico (só leitura)
        env:
          SUPABASE_DB_URL: postgresql://postgres.${{ secrets.SUPABASE_PROJECT_ID }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-${{ steps.regiao.outputs.regiao }}.pooler.supabase.com:5432/postgres
        run: node scripts/diagnosticar-ambiente.mjs | tee /tmp/diagnostico-ambiente.txt

      - name: Publicar resultado no Step Summary
        if: always()
        run: |
          echo "## Diagnóstico de ambiente (produção, $(date -u +%Y-%m-%dT%H:%M:%SZ))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/diagnostico-ambiente.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload do relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-ambiente
          path: /tmp/diagnostico-ambiente.txt
          retention-days: 90
