name: CI (OS monorepo)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo precisa do histórico para calcular o "affected"
      # Sem `with: version` — pnpm/action-setup@v4 recusa rodar se a versão também estiver
      # fixada no package.json (`packageManager: pnpm@9.0.0`), erro "Multiple versions of pnpm
      # specified". A versão vem só do packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # dependency-cruiser 18 exige Node ^22||^24||>=26 (arch:check falhava em "20").
          node-version: "22"
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - run: pnpm install --frozen-lockfile
        id: install

      # Gates da esteira SDD (no monorepo inteiro)
      # Executar os gates independentes mesmo após uma falha anterior; cada falha
      # continua reprovando o job. Evita várias rodadas para descobrir o lote inteiro.
      - name: Auditoria da esteira
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run audit:esteira
      - name: Fidelidade spec→implementação
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run eval:spec
      - name: Diagramas Mermaid
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/validate-mermaid.mjs
      - name: Consistência de Edge Functions (função órfã / invoke sem função)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run check:edge-functions
      - name: Tipos das Edge Functions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: deno check --node-modules-dir=auto supabase/functions/*/index.ts
      - name: Testes Deno das Edge Functions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: deno test --node-modules-dir=auto --allow-env --allow-net supabase/functions

      # Gates de segurança (BLOQUEANTES)
      # gitleaks via CLI (MIT, grátis) — a gitleaks-action exige GITLEAKS_LICENSE em repos de
      # organização (caso deste repo) e falha sem ela.
      - name: Secret scanning (gitleaks)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1
      - name: Dependências vulneráveis (runtime)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm audit --prod --audit-level=high

      # Gates de código — só nos pacotes AFETADOS (turbo affected) para feedback rápido
      - name: Typecheck (affected)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm turbo run typecheck --filter="...[origin/${{ github.base_ref || 'main' }}]"
      - name: Test (affected)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          # Origem sintética: não aponta para o projeto real nem contém credenciais.
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: test-only-public-key
        run: pnpm turbo run test --filter="...[origin/${{ github.base_ref || 'main' }}]"
      - name: Arquitetura (dependência DDD por máquina)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run arch:check
      - name: Biome (repo inteiro, com baseline temporária)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node --test scripts/biome-baseline.test.mjs
          node scripts/biome-baseline.mjs
      - name: Build (affected)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm turbo run build --filter="...[origin/${{ github.base_ref || 'main' }}]"

      # Gates de design (movidos do pre-push local para cá; rodam todos e listam todas as falhas)
      - name: Gates de design (tokens, primitivas, diálogos, catch, reticência, sombras, movimento, tipografia, div clicável)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          fail=0
          for c in tokens-cor primitivas dialogos-nativos catch-silencioso reticencia sombras movimento tipografia div-clicavel; do
            node "scripts/check-$c.mjs" || fail=1
          done
          exit $fail

  migrations:
    # Squawk = SEGURANÇA de migration (locks, breaking change, downtime). lint-migrations.mjs =
    # convenções da Trivia que nenhum tool pronto cobre (DROP sem reverso, CREATE POLICY sem
    # GRANT). Separado porque roda mesmo em PR que não toca código, e é barato.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Squawk (segurança de migration)
        uses: sbdchd/squawk-action@v2
        with:
          pattern: |
            supabase/migrations/*.sql
          config: .squawk.toml
          # Supabase roda cada migration dentro de transação — sem isto, Squawk avisa "sem
          # transação" em toda migration (falso positivo para este ambiente).
          assume-in-transaction: "true"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Convenções de migration (DROP sem reverso, CREATE POLICY sem GRANT)
        run: node scripts/lint-migrations.mjs

  db-tests:
    # Roda migrations + pgTAP contra um Postgres local via Docker — runners do GitHub Actions já
    # têm Docker. Substitui a necessidade de Docker local para validar RLS/invariantes de banco
    # (ver STATE.md e specs/E00-S05-autenticacao-autorizacao/tasks.md — "Pendências antes do merge").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # CLI 2.115–2.119 reproduz erro 25P01 em migrations com LOCK TABLE (supabase/cli#6347).
          # 2.114.0 é a versão mais nova verificada neste projeto sem erro; revisar após fix upstream.
          version: 2.114.0
      - name: Subir Supabase local (Docker) — aplica migrations do zero
        run: supabase start
      - name: pgTAP — suíte SQL versionada
        # Arquivos manuais de setup/concorrência e remote_promotion_smoke.sql não são casos pgTAP
        # da suíte local; este glob seleciona os testes automatizados com plano .test.sql.
        run: supabase test db supabase/tests/*.test.sql
