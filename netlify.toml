[build]
  base    = "apps/web"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.0.0"
  # E01-S199: fila "Campo a conciliar" do Kanban. LIGADA em 24/11/2026 para a homologação —
  # gate pcm.sso_consulta_estado_campo_gate aberto e capacidade concedida no mesmo dia.
  # Só leitura: não escreve no SO nem no Auvo.
  VITE_SSO_CAMPO_A_CONCILIAR_ENABLED = "true"
  # E01-S200: matriz de movimentacoes do Kanban. LIGADA em 24/11/2026. Só RESTRINGE movimentação
  # manual; a automação (retorno do Auvo, T-24, campo) continua livre por desenho.
  VITE_SSO_MATRIZ_TRANSICOES_ENABLED = "true"
  # E01-S201: monitor consolidado das excecoes do Auvo em T-24. LIGADA em 24/11/2026.
  # Só leitura — lê a fila do Auvo com left join, nunca enfileira.
  VITE_SSO_MONITOR_EXCECOES_AUVO_ENABLED = "true"
  # E01-S202: Agenda do Tecnico como projecao da Visita. LIGADA em 24/11/2026 — gate
  # pcm.capacidade_agenda_tecnico_gate aberto no mesmo dia. Só leitura.
  VITE_SSO_AGENDA_PROJECAO_VISITA_ENABLED = "true"
  # E01-S203: criacao manual do Plano PMOC a partir de um Contrato PMOC (ADR-1698, decisao (b)).
  # CONTINUA DESLIGADA, de propósito: depende de dois gates COMPARTILHADOS com E01-S166, que não
  # foram abertos. Abri-los afeta outra jornada — merece decisão própria, não carona nesta.
  VITE_SSO_PLANO_PMOC_MANUAL_ENABLED = "false"
  # E01-S190: navegacao agrupada em Trabalho, Gestao e Administracao (BL 013). LIGADA em
  # 24/11/2026 para a homologação. Desligar volta ao menu anterior, sem deploy de código.
  VITE_SSO_NAVEGACAO_POR_FUNCAO_ENABLED = "true"
  # E01-S190 task 9: Assessment vira Inspecao do tipo "Diagnostico Inicial do Cliente" e sai do
  # menu (migrations 1868/1869, ADR-1697). LIGADA em 24/11/2026. A classificação do dado já estava
  # aplicada em produção; esta flag só tira o item do menu. PMOC segue no menu.
  VITE_SSO_ASSESSMENT_COMO_INSPECAO_ENABLED = "true"
  # E01-S195: trechos de deslocamento, enquadramento residencial x operacional. LIGADA em
  # 24/11/2026 — gate pcm.sso_trechos_deslocamento_gate aberto no mesmo dia. Escreve só em
  # tabela própria do SO.
  VITE_SSO_TRECHOS_DESLOCAMENTO_ENABLED = "true"
  # Contêiner da aba "Capacidade e Agenda" (Visão 360 → Estrutura), onde vivem os Trechos de
  # deslocamento e as Fontes de Demanda. Declarada aqui pela primeira vez: sem ela, ligar os
  # Trechos não traz a tela, porque o bloco inteiro não renderiza.
  VITE_SSO_CAPACIDADE_AGENDA_ENABLED = "true"

  # ── E00-S30 (25/11/2026): destrave do Financeiro e do Comercial para exploração ──────────────
  # Autorização do Lucas em 25/11, com o cliente ainda não operando o sistema. A migration 1872
  # abriu as 72 travas de banco correspondentes; sem as flags abaixo as telas continuariam
  # retornando null, e sem a migration estas flags trariam tela que o banco recusa. As duas pontas
  # andam juntas, sempre.
  # Desligar qualquer uma devolve o estado anterior sem deploy de código — é uma variável.

  # Financeiro — fila de faturáveis, conferência de serviço e material, documentos de
  # competência, parcelas, publicação de cobrança no portal do cliente (50 flags).
  VITE_SSO_ALOCACAO_DOCUMENTO_MEDIADA_ENABLED = "true"
  VITE_SSO_ALOCAR_FATURAVEL_ENABLED = "true"
  VITE_SSO_ANEXOS_FATURAVEIS_ENABLED = "true"
  VITE_SSO_ATESTACAO_SERVICO_ENABLED = "true"
  VITE_SSO_CANCELAMENTO_FATURAVEL_ENABLED = "true"
  VITE_SSO_CANDIDATO_LINHA_ENABLED = "true"
  VITE_SSO_CANDIDATO_SERVICO_ENABLED = "true"
  VITE_SSO_CLASSIFICACAO_FATO_SERVICO_ENABLED = "true"
  VITE_SSO_CONFERENCIA_CANDIDATO_SERVICO_ENABLED = "true"
  VITE_SSO_CONFERENCIA_ITENS_SERVICO_ENABLED = "true"
  VITE_SSO_CONFERENCIA_SERVICO_CONSOLIDADA_ENABLED = "true"
  VITE_SSO_CONFERIR_ESTORNO_ENABLED = "true"
  VITE_SSO_CORRECAO_MODO_PROPOSTA_ENABLED = "true"
  VITE_SSO_CORRIGIR_FATURAVEL_ENABLED = "true"
  VITE_SSO_CORRIGIR_FATURAVEL_MEDIADO_ENABLED = "true"
  VITE_SSO_DATAS_DOCUMENTOS_ENABLED = "true"
  VITE_SSO_DECLARACAO_MATERIAL_ENABLED = "true"
  VITE_SSO_DIAGNOSTICO_ACEITE_COMPLEMENTO_ENABLED = "true"
  VITE_SSO_DIAGNOSTICO_DOCUMENTOS_ENABLED = "true"
  VITE_SSO_DIAGNOSTICO_ORIGEM_OS_ENABLED = "true"
  VITE_SSO_DOCUMENTOS_COMPETENCIA_ENABLED = "true"
  VITE_SSO_DOCUMENTO_COBRANCA_ENABLED = "true"
  VITE_SSO_DOCUMENTO_INTERNO_ENABLED = "true"
  VITE_SSO_FATO_EXECUCAO_DECLARADO_ENABLED = "true"
  VITE_SSO_FATURAVEIS_ENABLED = "true"
  VITE_SSO_FATURAVEL_PROPOSTA_ENABLED = "true"
  VITE_SSO_FILTRO_COMPETENCIA_FATURAVEIS_ENABLED = "true"
  VITE_SSO_FILTRO_FATURAVEIS_SERVIDOR_ENABLED = "true"
  VITE_SSO_HISTORICO_FATURAVEL_ENABLED = "true"
  VITE_SSO_HISTORICO_FATURAVEL_TODAS_ORIGENS_ENABLED = "true"
  VITE_SSO_HISTORICO_REVISAO_FATURAVEL_ENABLED = "true"
  VITE_SSO_MATERIAL_LINHA_ENABLED = "true"
  VITE_SSO_MATERIAL_PROPOSTA_ENABLED = "true"
  VITE_SSO_MODO_FATURAMENTO_PROPOSTA_ENABLED = "true"
  VITE_SSO_PARCELA_ADICIONAL_ENABLED = "true"
  VITE_SSO_PREVIA_IMPEDIMENTOS_PARCELA_ENABLED = "true"
  VITE_SSO_PREVIA_ORIGEM_SERVICO_ENABLED = "true"
  VITE_SSO_PREVIA_PARCELA_DOCUMENTO_ENABLED = "true"
  VITE_SSO_PUBLICAR_COBRANCA_OS_ENABLED = "true"
  VITE_SSO_RASTREIO_CANDIDATO_SERVICO_ENABLED = "true"
  VITE_SSO_RASTREIO_LINHA_MATERIAL_ENABLED = "true"
  VITE_SSO_RECONCILIACAO_SERVICO_MATERIAL_ENABLED = "true"
  VITE_SSO_RECUPERAR_PARCELA_ENABLED = "true"
  VITE_SSO_RELATORIO_ALOCACAO_PAGAMENTO_ENABLED = "true"
  VITE_SSO_RELATORIO_DESPESAS_FATURAVEIS_ENABLED = "true"
  VITE_SSO_RELATORIO_DESPESAS_FATURAVEIS_MEDIADO_ENABLED = "true"
  VITE_SSO_REVISAO_ORIGENS_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_SERVICO_EXTRA_ENABLED = "true"
  VITE_SSO_SNAPSHOT_SERVICO_MEDIADO_ENABLED = "true"
  VITE_SSO_VINCULO_RESPOSTA_SERVICO_ENABLED = "true"

  # Comercial — orçamento operacional, fontes de aquisição, composição mista, exceção de
  # preço, dispensa, histórico legado e vínculo de assessment (35 flags).
  VITE_SSO_AUTORIZACAO_COMPLEMENTO_ENABLED = "true"
  VITE_SSO_CLASSIFICACAO_LINHA_ENABLED = "true"
  VITE_SSO_COMPOSICAO_MISTA_ENABLED = "true"
  VITE_SSO_CORRELACAO_GASTO_ENABLED = "true"
  VITE_SSO_CORRELACAO_GASTO_MEDIADA_ENABLED = "true"
  VITE_SSO_CRIAR_ORCAMENTO_OPERACIONAL_ENABLED = "true"
  VITE_SSO_CUSTOS_PROPOSTA_ESCOPADOS_ENABLED = "true"
  VITE_SSO_DECISAO_CORRELACAO_ENABLED = "true"
  VITE_SSO_DECISAO_PCM_ORCAMENTO_ENABLED = "true"
  VITE_SSO_DIAGNOSTICO_FONTE_RETIFICADA_ENABLED = "true"
  VITE_SSO_DISPENSA_ORCAMENTO_ENABLED = "true"
  VITE_SSO_EXCECAO_PRECO_MEDIADA_ENABLED = "true"
  VITE_SSO_EXCECAO_PRECO_OPERACIONAL_ENABLED = "true"
  VITE_SSO_FONTES_AQUISICAO_ENABLED = "true"
  VITE_SSO_HISTORICO_COMPOSICAO_MISTA_ENABLED = "true"
  VITE_SSO_HISTORICO_DISPENSA_ENABLED = "true"
  VITE_SSO_HISTORICO_FONTES_ORCAMENTO_ENABLED = "true"
  VITE_SSO_HISTORICO_LEGADO_DECISOES_SEPARADAS_ENABLED = "true"
  VITE_SSO_HISTORICO_LEGADO_MEDIADO_ENABLED = "true"
  VITE_SSO_HISTORICO_LEGADO_PRE_OS_DECISOES_SEPARADAS_ENABLED = "true"
  VITE_SSO_HISTORICO_ORCAMENTO_LEGADO_ENABLED = "true"
  VITE_SSO_HISTORICO_ORCAMENTO_PRE_OS_ENABLED = "true"
  VITE_SSO_ORCAMENTO_PARCELAS_ENABLED = "true"
  VITE_SSO_ORCAMENTO_SEM_OPORTUNIDADE_ENABLED = "true"
  VITE_SSO_PAINEL_ORCAMENTOS_OPERACIONAIS_ENABLED = "true"
  VITE_SSO_PUBLICAR_ITENS_PROPOSTA_ENABLED = "true"
  VITE_SSO_PUBLICAR_ORCAMENTO_OPERACIONAL_ENABLED = "true"
  VITE_SSO_RECIBO_CORRELACAO_GASTO_ENABLED = "true"
  VITE_SSO_RECIBO_DECISAO_CORRELACAO_ENABLED = "true"
  VITE_SSO_RETIFICACAO_CLASSIFICACAO_ENABLED = "true"
  VITE_SSO_RETIFICAR_FONTE_AQUISICAO_ENABLED = "true"
  VITE_SSO_RETIFICAR_FONTE_UTILIZADA_ENABLED = "true"
  VITE_SSO_REVOGAR_AUTORIZACAO_COMPLEMENTO_ENABLED = "true"
  VITE_SSO_VINCULO_ASSESSMENT_MEDIADO_ENABLED = "true"
  VITE_SSO_VISIBILIDADE_ORCAMENTO_ENABLED = "true"

# SPA: todas as rotas servem index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache longo para assets com hash de conteúdo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
