  # flags tinha sido declarada — a tela existia e ninguém alcançava. LIGADAS em 25/11/2026 para a
  # homologação, junto do destrave de banco da migration 1875.
  # A autoridade é o gate de banco, não a flag: as varreduras periódicas (pcm.sso_varredura_fila_
  # gate, sso_varredura_os_gate, sso_varredura_origens_gate) continuam FECHADAS por ADR-1264, então
  # as telas que dependem do que a varredura escreveria aparecem vazias — por desenho, não por bug.
  VITE_SSO_ACOES_LOCAIS_FILA_ENABLED = "true"
  VITE_SSO_AVALIACAO_EVIDENCIA_OS_ENABLED = "true"
  VITE_SSO_COINCIDENCIAS_FILA_ENABLED = "true"
  VITE_SSO_CONFIRMAR_RETORNO_FILA_ENABLED = "true"
  VITE_SSO_CONFIRMAR_RETORNO_PROPRIEDADE_OS_ENABLED = "true"
  VITE_SSO_CONFLITOS_PROPRIEDADE_FILA_ENABLED = "true"
  VITE_SSO_CONFLITOS_PROPRIEDADE_OS_ENABLED = "true"
  VITE_SSO_CONFLITOS_WEBHOOK_ENABLED = "true"
  VITE_SSO_DEMORAS_OBSERVADAS_ENABLED = "true"
  VITE_SSO_DIAGNOSTICO_FALHA_FILA_ENABLED = "true"
  VITE_SSO_ESTATISTICAS_TRIAGEM_ENABLED = "true"
  VITE_SSO_EVENTOS_ORIGENS_MEDIADOS_ENABLED = "true"
  VITE_SSO_EVENTOS_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_EVIDENCIA_OS_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_EXPORTAR_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_FILTRO_NOTAS_FILA_ENABLED = "true"
  VITE_SSO_FILTRO_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_HISTORICO_DEMORA_ENABLED = "true"
  VITE_SSO_HISTORICO_ORIGENS_ENABLED = "true"
  VITE_SSO_HISTORICO_SOLICITACOES_RECUPERACAO_ENABLED = "true"
  VITE_SSO_INBOX_OS_INCERTA_ENABLED = "true"
  VITE_SSO_INCONSISTENCIAS_FILA_ENABLED = "true"
  VITE_SSO_INICIO_PROCESSAMENTO_ENABLED = "true"
  VITE_SSO_OBSERVACAO_FILA_ENABLED = "true"
  VITE_SSO_OBSERVACAO_FILA_LOTE_ENABLED = "true"
  VITE_SSO_OBSERVACAO_NOVO_CLIENTE_ENABLED = "true"
  VITE_SSO_OBSERVAR_OS_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_ORIGENS_DESPESA_INCOMPLETAS_ENABLED = "true"
  VITE_SSO_ORIGENS_INTERNAS_MEDIADAS_ENABLED = "true"
  VITE_SSO_PROCESSAMENTOS_DEMORADOS_ENABLED = "true"
  VITE_SSO_RECIBO_SOLICITACAO_RECUPERACAO_ENABLED = "true"
  VITE_SSO_RECONCILIAR_RESERVA_LEGADA_ENABLED = "true"
  VITE_SSO_RESERVAS_ENVIO_LEGADO_ENABLED = "true"
  VITE_SSO_RESOLUCAO_CONFLITOS_ENABLED = "true"
  VITE_SSO_RESUMO_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_REVALIDAR_PREVIA_FILA_ENABLED = "true"
  VITE_SSO_REVISAO_LATERAL_FILA_ENABLED = "true"
  VITE_SSO_SNAPSHOT_OS_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_SOLICITAR_RECUPERACAO_FILA_ENABLED = "true"
  VITE_SSO_TRIAGEM_INTENCOES_REPROGRAMACAO_ENABLED = "true"

# SPA: todas as rotas servem index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache longo para assets com hash de conteúdo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
