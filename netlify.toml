[build]
  base    = "apps/web"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.0.0"
  # E01-S199: fila "Campo a conciliar" do Kanban. Desligada até o gate de banco
  # pcm.sso_consulta_estado_campo_gate ser aberto (decisão operacional separada).
  VITE_SSO_CAMPO_A_CONCILIAR_ENABLED = "false"
  # E01-S200: matriz de movimentacoes do Kanban, desligada ate validacao em uso real.
  VITE_SSO_MATRIZ_TRANSICOES_ENABLED = "false"
  # E01-S190: navegacao agrupada em Trabalho, Gestao e Administracao (BL 013). Desligada ate a
  # homologacao — com ela desligada o menu e exatamente o anterior.
  VITE_SSO_NAVEGACAO_POR_FUNCAO_ENABLED = "false"
  # E01-S195 AC-F2: primeira flag VITE_SSO_* declarada aqui — as demais (ver .env.example) são
  # hoje só setadas no dashboard do Netlify, achado da reanálise de alcance-no-front (não
  # corrigido retroativamente nesta story, fora de escopo unilateral).
  VITE_SSO_TRECHOS_DESLOCAMENTO_ENABLED = "false"

# SPA: todas as rotas servem index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache longo para assets com hash de conteúdo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
