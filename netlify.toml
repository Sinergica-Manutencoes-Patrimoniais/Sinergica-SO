[build]
  base    = "apps/web"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.0.0"
  # E01-S199: fila "Campo a conciliar" do Kanban. LIGADA em 24/11/2026 para a homologação —
  # gate pcm.sso_consulta_estado_campo_gate aberto e capacidade concedida no mesmo dia.
  # Só leitura: não escreve no SO nem no Auvo.
  VITE_SSO_CAMPO_A_CONCILIAR_ENABLED = "true"
  # E01-S200: matriz de movimentacoes do Kanban. LIGADA em 24/11/2026. Só RESTRINGE movimentação
  # manual; a automação (retorno do Auvo, T-24, campo) continua livre por desenho.
  VITE_SSO_MATRIZ_TRANSICOES_ENABLED = "true"
  # E01-S201: monitor consolidado das excecoes do Auvo em T-24. LIGADA em 24/11/2026.
  # Só leitura — lê a fila do Auvo com left join, nunca enfileira.
  VITE_SSO_MONITOR_EXCECOES_AUVO_ENABLED = "true"
  # E01-S202: Agenda do Tecnico como projecao da Visita. LIGADA em 24/11/2026 — gate
  # pcm.capacidade_agenda_tecnico_gate aberto no mesmo dia. Só leitura.
  VITE_SSO_AGENDA_PROJECAO_VISITA_ENABLED = "true"
  # E01-S203: criacao manual do Plano PMOC a partir de um Contrato PMOC (ADR-1698, decisao (b)).
  # CONTINUA DESLIGADA, de propósito: depende de dois gates COMPARTILHADOS com E01-S166, que não
  # foram abertos. Abri-los afeta outra jornada — merece decisão própria, não carona nesta.
  VITE_SSO_PLANO_PMOC_MANUAL_ENABLED = "false"
  # E01-S190: navegacao agrupada em Trabalho, Gestao e Administracao (BL 013). LIGADA em
  # 24/11/2026 para a homologação. Desligar volta ao menu anterior, sem deploy de código.
  VITE_SSO_NAVEGACAO_POR_FUNCAO_ENABLED = "true"
  # E01-S190 task 9: Assessment vira Inspecao do tipo "Diagnostico Inicial do Cliente" e sai do
  # menu (migrations 1868/1869, ADR-1697). LIGADA em 24/11/2026. A classificação do dado já estava
  # aplicada em produção; esta flag só tira o item do menu. PMOC segue no menu.
  VITE_SSO_ASSESSMENT_COMO_INSPECAO_ENABLED = "true"
  # E01-S195: trechos de deslocamento, enquadramento residencial x operacional. LIGADA em
  # 24/11/2026 — gate pcm.sso_trechos_deslocamento_gate aberto no mesmo dia. Escreve só em
  # tabela própria do SO.
  VITE_SSO_TRECHOS_DESLOCAMENTO_ENABLED = "true"
  # Contêiner da aba "Capacidade e Agenda" (Visão 360 → Estrutura), onde vivem os Trechos de
  # deslocamento e as Fontes de Demanda. Declarada aqui pela primeira vez: sem ela, ligar os
  # Trechos não traz a tela, porque o bloco inteiro não renderiza.
  VITE_SSO_CAPACIDADE_AGENDA_ENABLED = "true"

  # E01-S185: jornada de reconciliação (Auvo × Comercial × Financeiro). As 51 telas de
  # apps/web/src/features/pcm/interfaces/reconciliacao/ já existiam no bundle, mas nenhuma destas
  # flags tinha sido declarada — a tela existia e ninguém alcançava. LIGADAS em 25/11/2026 para a
  # homologação, junto do destrave de banco da migration 1875.
  # A autoridade é o gate de banco, não a flag: as varreduras periódicas (pcm.sso_varredura_fila_
  # gate, sso_varredura_os_gate, sso_varredura_origens_gate) continuam FECHADAS por ADR-1264, então
  # as telas que dependem do que a varredura escreveria aparecem vazias — por desenho, não por bug.
  VITE_SSO_ACOES_LOCAIS_FILA_ENABLED = "true"
  VITE_SSO_AVALIACAO_EVIDENCIA_OS_ENABLED = "true"
  VITE_SSO_COINCIDENCIAS_FILA_ENABLED = "true"
  VITE_SSO_CONFIRMAR_RETORNO_FILA_ENABLED = "true"
  VITE_SSO_CONFIRMAR_RETORNO_PROPRIEDADE_OS_ENABLED = "true"
  VITE_SSO_CONFLITOS_PROPRIEDADE_FILA_ENABLED = "true"
  VITE_SSO_CONFLITOS_PROPRIEDADE_OS_ENABLED = "true"
  VITE_SSO_CONFLITOS_WEBHOOK_ENABLED = "true"
  VITE_SSO_DEMORAS_OBSERVADAS_ENABLED = "true"
  VITE_SSO_DIAGNOSTICO_FALHA_FILA_ENABLED = "true"
  VITE_SSO_ESTATISTICAS_TRIAGEM_ENABLED = "true"
  VITE_SSO_EVENTOS_ORIGENS_MEDIADOS_ENABLED = "true"
  VITE_SSO_EVENTOS_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_EVIDENCIA_OS_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_EXPORTAR_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_FILTRO_NOTAS_FILA_ENABLED = "true"
  VITE_SSO_FILTRO_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_HISTORICO_DEMORA_ENABLED = "true"
  VITE_SSO_HISTORICO_ORIGENS_ENABLED = "true"
  VITE_SSO_HISTORICO_SOLICITACOES_RECUPERACAO_ENABLED = "true"
  VITE_SSO_INBOX_OS_INCERTA_ENABLED = "true"
  VITE_SSO_INCONSISTENCIAS_FILA_ENABLED = "true"
  VITE_SSO_INICIO_PROCESSAMENTO_ENABLED = "true"
  VITE_SSO_OBSERVACAO_FILA_ENABLED = "true"
  VITE_SSO_OBSERVACAO_FILA_LOTE_ENABLED = "true"
  VITE_SSO_OBSERVACAO_NOVO_CLIENTE_ENABLED = "true"
  VITE_SSO_OBSERVAR_OS_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_ORIGENS_DESPESA_INCOMPLETAS_ENABLED = "true"
  VITE_SSO_ORIGENS_INTERNAS_MEDIADAS_ENABLED = "true"
  VITE_SSO_PROCESSAMENTOS_DEMORADOS_ENABLED = "true"
  VITE_SSO_RECIBO_SOLICITACAO_RECUPERACAO_ENABLED = "true"
  VITE_SSO_RECONCILIAR_RESERVA_LEGADA_ENABLED = "true"
  VITE_SSO_RESERVAS_ENVIO_LEGADO_ENABLED = "true"
  VITE_SSO_RESOLUCAO_CONFLITOS_ENABLED = "true"
  VITE_SSO_RESUMO_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_REVALIDAR_PREVIA_FILA_ENABLED = "true"
  VITE_SSO_REVISAO_LATERAL_FILA_ENABLED = "true"
  VITE_SSO_SNAPSHOT_OS_RECONCILIACAO_ENABLED = "true"
  VITE_SSO_SOLICITAR_RECUPERACAO_FILA_ENABLED = "true"
  VITE_SSO_TRIAGEM_INTENCOES_REPROGRAMACAO_ENABLED = "true"

# SPA: todas as rotas servem index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache longo para assets com hash de conteúdo
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
